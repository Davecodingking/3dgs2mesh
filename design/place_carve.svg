<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"
     font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Noto Sans SC, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>

  <text x="40" y="42" font-size="22" font-weight="bold" fill="#1d2a30">摆放 + 删点：逻辑</text>
  <text x="40" y="66" font-size="13" fill="#777">输入：抠图取出的原物体的点、SAM 3D 生成的网格；输出：摆好的网格、删过点的 3DGS</text>

  <!-- ============ inputs ============ -->
  <text x="40" y="106" font-size="16" font-weight="bold" fill="#4a5560">输入</text>
  <rect x="40" y="118" width="250" height="80" rx="10" fill="#f5f7f9" stroke="#8a96a3" stroke-width="1.5"/>
  <text x="58" y="144" font-size="15" font-weight="bold" fill="#1d2a30">原物体的点</text>
  <text x="58" y="166" font-size="13" fill="#444">3DGS 投到切图上，</text>
  <text x="58" y="185" font-size="13" fill="#444">落在抠图里的最前面一层</text>
  <rect x="40" y="214" width="250" height="80" rx="10" fill="#f5f7f9" stroke="#8a96a3" stroke-width="1.5"/>
  <text x="58" y="240" font-size="15" font-weight="bold" fill="#1d2a30">生成的网格</text>
  <text x="58" y="262" font-size="13" fill="#444">SAM 3D 生成，</text>
  <text x="58" y="281" font-size="13" fill="#444">带它判断的朝向</text>
  <rect x="40" y="310" width="250" height="80" rx="10" fill="#f5f7f9" stroke="#8a96a3" stroke-width="1.5"/>
  <text x="58" y="336" font-size="15" font-weight="bold" fill="#1d2a30">地面高度</text>
  <text x="58" y="358" font-size="13" fill="#444">物体正下方的点量出来</text>
  <text x="58" y="377" font-size="13" fill="#444">（桌上的东西 = 桌面高度）</text>
  <line x1="290" y1="158" x2="328" y2="158" stroke="#4a5560" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="290" y1="254" x2="328" y2="254" stroke="#4a5560" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="290" y1="350" x2="328" y2="350" stroke="#4a5560" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- ============ place ============ -->
  <rect x="330" y="88" width="460" height="550" rx="14" fill="#f3f7fd" stroke="#2f6db5" stroke-width="2"/>
  <text x="352" y="118" font-size="18" font-weight="bold" fill="#2f6db5">摆放</text>
  <text x="352" y="140" font-size="13" fill="#555">把网格挪动、缩放，直到和原物体的点贴得最好</text>

  <rect x="350" y="154" width="420" height="96" rx="8" fill="#ffffff" stroke="#9db8dc"/>
  <text x="366" y="178" font-size="15" font-weight="bold" fill="#1d2a30">① 起点</text>
  <text x="366" y="200" font-size="13" fill="#333">朝向：直接用 SAM 3D 判断的朝向</text>
  <text x="366" y="220" font-size="13" fill="#333">摆正：网格里最大的水平面（坐垫、桌面）放平</text>
  <text x="366" y="240" font-size="13" fill="#333">大小：原物体的点有多宽 ÷ 网格有多宽</text>

  <rect x="350" y="264" width="420" height="78" rx="8" fill="#ffffff" stroke="#9db8dc"/>
  <text x="366" y="288" font-size="15" font-weight="bold" fill="#1d2a30">② 只调四个量</text>
  <text x="366" y="310" font-size="13" fill="#333">朝向 ±30°、大小 ±35%、左右、前后</text>
  <text x="366" y="330" font-size="13" fill="#333">高度不调：网格最低点始终放在地面高度上</text>

  <rect x="350" y="356" width="420" height="124" rx="8" fill="#ffffff" stroke="#9db8dc"/>
  <text x="366" y="380" font-size="15" font-weight="bold" fill="#1d2a30">③ 打分（三项相加，越小越好）</text>
  <text x="366" y="404" font-size="13" fill="#333">a  原物体的点 → 网格的距离：原来的表面要贴在网格上</text>
  <text x="366" y="426" font-size="13" fill="#333">b  网格朝相机那一面 → 原物体的点：网格不能凸出来</text>
  <text x="366" y="448" font-size="13" fill="#333">c  网格在图上的外框 ↔ 抠图的外框：要对齐</text>
  <text x="366" y="470" font-size="13" fill="#777">另加：朝向离 SAM 3D 的越远，罚一点分</text>

  <rect x="350" y="494" width="420" height="124" rx="8" fill="#ffffff" stroke="#9db8dc"/>
  <text x="366" y="518" font-size="15" font-weight="bold" fill="#1d2a30">④ 找分数最小的</text>
  <text x="366" y="540" font-size="13" fill="#333">先试 7 个朝向（-30° 到 +30°）挑最好的，</text>
  <text x="366" y="560" font-size="13" fill="#333">再把四个量轮流小步调，步子越调越小</text>
  <text x="366" y="580" font-size="13" fill="#333">摆好后在物体周围一圈重新量地面，再调一轮</text>
  <text x="366" y="600" font-size="13" fill="#777">（桌上的东西不重新量，免得量到地板）</text>

  <!-- arrow place -> carve -->
  <line x1="790" y1="254" x2="828" y2="254" stroke="#4a5560" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="809" y="244" font-size="12" fill="#4a5560" text-anchor="middle">摆好的</text>
  <text x="809" y="274" font-size="12" fill="#4a5560" text-anchor="middle">网格</text>

  <!-- ============ carve ============ -->
  <rect x="830" y="88" width="330" height="400" rx="14" fill="#fdf5ec" stroke="#c76b12" stroke-width="2"/>
  <text x="852" y="118" font-size="18" font-weight="bold" fill="#c76b12">删点</text>
  <text x="852" y="140" font-size="13" fill="#555">用摆好的网格圈出原物体，删掉</text>

  <rect x="850" y="154" width="290" height="78" rx="8" fill="#ffffff" stroke="#e2b68a"/>
  <text x="866" y="178" font-size="15" font-weight="bold" fill="#1d2a30">① 圈一个盒子</text>
  <text x="866" y="200" font-size="13" fill="#333">按网格自己的朝向，</text>
  <text x="866" y="220" font-size="13" fill="#333">量出它的长、宽、高</text>

  <rect x="850" y="246" width="290" height="78" rx="8" fill="#ffffff" stroke="#e2b68a"/>
  <text x="866" y="270" font-size="15" font-weight="bold" fill="#1d2a30">② 放大一点</text>
  <text x="866" y="292" font-size="13" fill="#333">长、宽每边往外扩 10%；往下扩 4%，往上不扩</text>
  <text x="866" y="312" font-size="13" fill="#333">（网格摆得稍有偏差也能删干净）</text>

  <rect x="850" y="338" width="290" height="130" rx="8" fill="#ffffff" stroke="#e2b68a"/>
  <text x="866" y="362" font-size="15" font-weight="bold" fill="#1d2a30">③ 删掉盒子里的 3DGS 点</text>
  <text x="866" y="386" font-size="13" fill="#333">但这两种保留：</text>
  <text x="866" y="410" font-size="13" fill="#333">· 地面：贴着地面的那一薄层</text>
  <text x="866" y="434" font-size="13" fill="#333">· 顶上的东西：比网格顶还高的点</text>
  <text x="866" y="456" font-size="12" fill="#777">（比如桌面上放的花瓶）</text>

  <!-- ============ outputs ============ -->
  <line x1="560" y1="638" x2="560" y2="676" stroke="#4a5560" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="995" y1="488" x2="995" y2="676" stroke="#4a5560" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="40" y="700" font-size="16" font-weight="bold" fill="#4a5560">输出</text>
  <rect x="330" y="678" width="460" height="76" rx="10" fill="#eef6ee" stroke="#3f8a4a" stroke-width="1.5"/>
  <text x="352" y="706" font-size="15" font-weight="bold" fill="#1d2a30">摆好的网格 .glb + 变换 .json</text>
  <text x="352" y="730" font-size="13" fill="#444">和 3DGS 在同一个坐标里，直接叠在一起用</text>
  <rect x="830" y="678" width="330" height="76" rx="10" fill="#eef6ee" stroke="#3f8a4a" stroke-width="1.5"/>
  <text x="852" y="706" font-size="15" font-weight="bold" fill="#1d2a30">删过点的 3DGS .ply</text>
  <text x="852" y="730" font-size="13" fill="#444">原物体那块的点没了，其余不动</text>
</svg>
